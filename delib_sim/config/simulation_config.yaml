# DelibSim Configuration
# This configuration file defines the parameters for deliberation simulations.

# LLM Setup - Models used for deliberation agents
# For the main study, we use 11 model configurations across 5 model families
llm_setup:
  # GPT-5.1 (Reasoning)
  - model_name: "openai/gpt-5.1-reasoning"
    api_endpoint: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    count: 5
    provider: "openai"
    enabled: true
    reasoning_enabled: true
    reasoning_effort: "high"

  # GPT-5.1 (No Reasoning)
  - model_name: "openai/gpt-5.1-no-reasoning"
    api_endpoint: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    count: 5
    provider: "openai"
    enabled: true
    reasoning_enabled: false

  # Gemini-3-Pro-Preview (Reasoning)
  - model_name: "google/gemini-3-pro-preview-03-25-reasoning"
    api_endpoint: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    count: 5
    provider: "google"
    enabled: true
    reasoning_enabled: true
    reasoning_effort: "high"

  # Gemini-3-Pro-Preview (No Reasoning)
  - model_name: "google/gemini-3-pro-preview-03-25-no-reasoning"
    api_endpoint: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    count: 5
    provider: "google"
    enabled: true
    reasoning_enabled: false

  # DeepSeek-V3.2-Exp (Reasoning)
  - model_name: "deepseek/deepseek-v3.2-exp-reasoning"
    api_endpoint: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    count: 5
    provider: "deepseek"
    enabled: true
    reasoning_enabled: true
    reasoning_effort: "high"

  # DeepSeek-V3.2-Exp (No Reasoning)
  - model_name: "deepseek/deepseek-v3.2-exp-no-reasoning"
    api_endpoint: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    count: 5
    provider: "deepseek"
    enabled: true
    reasoning_enabled: false

  # Kimi-K2-Thinking (Reasoning)
  - model_name: "moonshotai/kimi-k2-thinking-reasoning"
    api_endpoint: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    count: 5
    provider: "moonshot"
    enabled: true
    reasoning_enabled: true
    reasoning_effort: "high"

  # Kimi-K2-Thinking (No Reasoning)
  - model_name: "moonshotai/kimi-k2-thinking-no-reasoning"
    api_endpoint: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    count: 5
    provider: "moonshot"
    enabled: true
    reasoning_enabled: false

  # Claude Opus 4.5 (No Reasoning - only non-reasoning variant used)
  - model_name: "anthropic/claude-opus-4.5"
    api_endpoint: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    count: 5
    provider: "anthropic"
    enabled: true
    reasoning_enabled: false

# Deliberation Settings
deliberation_protocol: "free_flow"  # "free_flow" or "guided"
group_size: 5                       # Agents per deliberation group
group_assignment_strategy: "individual_model"  # "mixed" or "individual_model"
num_deliberation_turns: 10          # Total turns (2 rounds x 5 agents)
random_seed: 42                     # For reproducibility
display_conversation: false         # Print conversation to console

# Survey Settings
survey_name: "swiss_health"         # Survey topic from surveys.xlsx

# DRI Assessment
dri_conversation_enabled: true      # Enable deliberation between DRI surveys
assess_dqi: true                    # Enable AQuA discourse quality assessment

# Temperature (0.0 for reproducibility)
global_temperature: 0.0

# Prompt Type
# "treatment" = normative deliberation prompt
# "control_1" or "control_2" = basic deliberation prompt
deliberation_prompt_type: "treatment"
